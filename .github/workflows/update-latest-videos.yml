name: Refresh latest YouTube videos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read YouTube feed and write latest videos
        run: python scripts/update_latest_videos.py
      - name: Commit updated list if changed
        run: |
          if ! git diff --quiet -- data/latest-videos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/latest-videos.json
            git commit -m "Refresh latest Dave Ferry Motors YouTube videos"
            git push
          fi
