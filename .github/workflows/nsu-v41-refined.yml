name: NSU v4.1 refined image review
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render-nsu-v41-refined.py'
      - '.github/workflows/nsu-v41-refined.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.event.pull_request.head.ref == 'v41-nsu-refinement-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy
      - run: python scripts/render-nsu-v41-refined.py
      - uses: actions/upload-artifact@v4
        with:
          name: nsu-v41-refined
          path: |
            assets/nsu-v41-refined/
            qa-nsu-v41-refined/
      - name: Save review-only candidate
        run: |
          test "$(git branch --show-current)" = "v41-nsu-refinement-20261127"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nsu-v41-refined qa-nsu-v41-refined
          if ! git diff --cached --quiet; then
            git commit -m "Render refined opaque NSU source and five-colour proof"
            git push origin HEAD:v41-nsu-refinement-20261127
          fi
