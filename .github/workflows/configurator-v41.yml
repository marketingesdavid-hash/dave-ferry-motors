name: Configurator v4.1 QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render-light-v41.py'
      - 'scripts/verify-configurator-v41.cjs'
      - 'assets/dfm-shop-v3.js'
      - '.github/workflows/configurator-v41.yml'
permissions:
  contents: write
jobs:
  preview:
    if: github.event.pull_request.head.ref == 'configurator-v41-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy
      - run: python scripts/render-light-v41.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          trap 'kill $!' EXIT
          node scripts/verify-configurator-v41.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v41-preview
          path: |
            assets/models-v41/
            qa-v41/
      - name: Save review assets on development branch
        if: always()
        run: |
          test "$(git branch --show-current)" = "configurator-v41-20261127"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models-v41 qa-v41
          if ! git diff --cached --quiet; then
            git commit -m "Render corrected light previews and v4.1 QA screenshots"
            git push origin HEAD:configurator-v41-20261127
          fi
