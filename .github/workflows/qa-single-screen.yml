name: Single screen mobile browser QA
on:
  pull_request:
    branches: [main]
    paths: ['scripts/qa-single-screen.cjs','.github/workflows/qa-single-screen.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 > /tmp/dfm-server.log 2>&1 &
          node scripts/qa-single-screen.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-screen-mobile
          path: qa-single-screen/
