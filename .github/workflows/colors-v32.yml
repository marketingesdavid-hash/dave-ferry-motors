name: Render fixed colour previews v3.2
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render-colors-v32.py'
      - '.github/workflows/colors-v32.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.event.pull_request.head.ref == 'colors-v32-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy
      - run: python scripts/render-colors-v32.py
      - uses: actions/upload-artifact@v4
        with:
          name: colour-previews-v32
          path: |
            assets/models-v32/
            qa-colors-v32/
      - name: Save generated previews to the review branch only
        run: |
          test "$(git branch --show-current)" = "colors-v32-20261127"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models-v32 qa-colors-v32
          if ! git diff --cached --quiet; then
            git commit -m "Render 16 colour photos and two visual QA contact sheets"
            git push origin HEAD:colors-v32-20261127
          fi
