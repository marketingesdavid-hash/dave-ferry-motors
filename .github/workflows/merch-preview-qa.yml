name: Merch preview QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/approved/models/**'
      - 'scripts/verify-merch-preview.cjs'
      - '.github/workflows/merch-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          trap 'kill $!' EXIT
          node scripts/verify-merch-preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merch-preview-screenshots
          path: qa-preview/
