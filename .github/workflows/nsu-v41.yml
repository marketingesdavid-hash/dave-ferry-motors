name: NSU v4.1 image QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render-nsu-v41.py'
      - '.github/workflows/nsu-v41.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.event.pull_request.head.ref == 'nsu-opacity-v41-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy
      - run: python scripts/render-nsu-v41.py
      - name: Save review assets on development branch
        run: |
          test "$(git branch --show-current)" = "nsu-opacity-v41-20261127"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nsu-v41 qa-nsu-v41
          if ! git diff --cached --quiet; then
            git commit -m "Render candidate NSU image with explicit component opacity"
            git push origin HEAD:nsu-opacity-v41-20261127
          fi
